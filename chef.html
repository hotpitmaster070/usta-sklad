<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Штаб Уста - Шеф</title>
<style>
body{margin:0;background:#1a1a1a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#2a2a2a;padding:30px;border-radius:12px;width:90%;max-width:500px}
h2{margin:0 0 20px;text-align:center}
.error{color:#ff3b30;text-align:center;margin-top:10px;font-size:14px}
.info{font-size:14px;color:#aaa;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box" id="app">
  <h2>Загрузка...</h2>
  <div class="info" id="debug"></div>
</div>

<script>
document.getElementById('debug').innerText = '1. Страница загрузилась';

const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
script.onload = () => {
  document.getElementById('debug').innerText = '2. Supabase загрузился. Запускаю...';
  
  const supabase = window.supabase.createClient(
    'https://xljogkyropyocvuuodfl.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
  );

  supabase.auth.getUser().then(({ data, error }) => {
    if (error || !data.user) {
      document.getElementById('app').innerHTML = '<h2>Не авторизован</h2><div class="error">Зайди через signup.html</div>';
      return;
    }
    
    document.getElementById('app').innerHTML = '<h2>Работает!</h2><div class="info">User ID: ' + data.user.id.slice(0,8) + '...</div>';
  }).catch(e => {
    document.getElementById('app').innerHTML = '<h2>Ошибка Supabase</h2><div class="error">' + e.message + '</div>';
  });
};
script.onerror = () => {
  document.getElementById('app').innerHTML = '<h2>Ошибка</h2><div class="error">Не удалось загрузить Supabase. Выключи AdBlock и обнови страницу</div>';
};
document.head.appendChild(script);
</script>
</body>
</html>
