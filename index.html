<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШТАБ УСТА</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
.screen { display: none; }
.screen.active { display: block; }
.btn { background: #ff3b30; color: #fff; border: none; padding: 18px; margin: 8px 0; width: 100%; font-size: 18px; font-weight: bold; border-radius: 12px; }
.btn-green { background: #34c759; }
.btn-grey { background: #48484a; }
.btn-secondary { background: #5e5e60; }
    input, select, textarea { width: 100%; padding: 15px; margin: 8px 0; font-size: 16px; border-radius: 8px; border: 1px solid #48484a; background: #2c2c2e; color: #fff; box-sizing: border-box; }
    h1, h2, h3 { text-align: center; }
    label { display: block; margin-top: 12px; color: #8e8e93; }
    table { width: 100%; margin-top: 15px; border-collapse: collapse; }
    td, th { padding: 12px; border-bottom: 1px solid #48484a; text-align: left; }
    th { color: #8e8e93; }
.kg { text-align: right; font-weight: bold; }
.card { background: #2c2c2e; padding: 15px; border-radius: 12px; margin: 10px 0; }
.table-wrap { overflow-x: auto; }
  </style>
</head>
<body>

<div id="login" class="screen active">
  <h1>ШТАБ УСТА 🧱</h1>
  <input id="pin" type="password" placeholder="ПИН для входа" />
  <button class="btn" onclick="login()">ВОЙТИ</button>
</div>

<div id="shef" class="screen">
  <h1>Экран Шефа 🧱</h1>
  <button class="btn" onclick="showScreen('prihod_form')">1. [+ ПРИХОД ТОВАРА]</button>
  <button class="btn" onclick="loadPovarsForZadanie()">2. [СОЗДАТЬ ЗАДАНИЕ]</button>
  <button class="btn" onclick="loadSklad()">4. [МОЙ СКЛАД]</button>
  <button class="btn" onclick="pokazatZagotovki()">5. [МОИ ЗАГОТОВКИ]</button>
  <button class="btn btn-grey" onclick="showScreen('spisanie_form')">6. [СПИСАНИЕ]</button>
  <button class="btn" onclick="pokazatOtchetSpisanie()">7. [ОТЧЁТ ПО СПИСАНИЮ]</button>
  <button class="btn" onclick="pokazatMesyacnyyOtchet()">8. [ОТЧЁТ ЗА МЕСЯЦ]</button>
  <button class="btn" onclick="startInventarizatsiya()">9. [ИНВЕНТАРИЗАЦИЯ]</button>
  <button class="btn btn-grey" onclick="logout()">ВЫЙТИ</button>
</div>

<div id="zadanie_form" class="screen">
  <h2>Новое задание</h2>
  <label>Кому:</label>
  <select id="komu_povar"></select>
  <label>Текст задания:</label>
  <textarea id="text_zadaniya" rows="4" placeholder="Сделать из обрезки говяжий фарш"></textarea>
  <button class="btn btn-green" onclick="saveZadanie()">ОТПРАВИТЬ ПОВАРУ</button>
  <button class="btn btn-grey" onclick="showScreen('shef')">НАЗАД</button>
</div>

<div id="sklad_screen" class="screen">
  <h2>Остатки на складе</h2>
  <div id="sklad_table"></div>
  <button class="btn btn-grey" onclick="showScreen('shef')">НАЗАД</button>
</div>

<div id="prihod_form" class="screen">
  <h2>Приход на склад</h2>
  <label>Товар:</label>
  <input id="tovar_name" placeholder="Вырезка говяжья" />
  <label>Вес, кг:</label>
  <input id="tovar_kg" type="number" placeholder="10" />
  <label>Поставщик:</label>
  <input id="postavshik" placeholder="Мясной двор" />
  <button class="btn btn-green" onclick="savePrihod()">СОХРАНИТЬ ПРИХОД</button>
  <button class="btn btn-grey" onclick="showScreen('shef')">НАЗАД</button>
</div>

<div id="povar_select" class="screen">
  <h1>Ты кто?</h1>
  <div id="povar_list"></div>
  <button class="btn btn-grey" onclick="logout()">ВЫЙТИ</button>
</div>

<div id="povar" class="screen">
  <h1 id="povar_name"></h1>
  <button class="btn" onclick="showScreen('vzyal_form')">ВЗЯЛ СО СКЛАДА</button>
  <button class="btn" onclick="loadMoiZadaniya('active')" style="position:relative">
    МОИ ЗАДАНИЯ
    <span id="zadanieBadge" style="display:none; position:absolute; right:15px; top:50%; transform:translateY(-50%); background:#ff3b30; color:#fff; border-radius:50%; padding:2px 8px; font-size:14px; font-weight:bold;"></span>
  </button>
  <button class="btn" onclick="showScreen('zagotovka_form')">СДЕЛАТЬ ЗАГОТОВКУ</button>
  <button class="btn btn-grey" onclick="showScreen('spisanie_form')">СПИСАНИЕ</button>
  <button class="btn btn-grey" onclick="logout()">ВЫЙТИ</button>
</div>

<div id="zagotovka_form" class="screen">
  <h2>Сделать заготовку</h2>
  <div class="card">
    <h3>Взял со склада:</h3>
    <input type="text" id="z_syrye" placeholder="Что взял: Туша баранины">
    <input type="number" id="z_syrye_kg" placeholder="Сколько кг взял" step="0.01" oninput="calcMusor()">

    <h3>Получилось продуктов:</h3>
    <div id="products_list"></div>

    <button class="btn btn-grey" style="margin-top:10px;" onclick="addProductField()">+ ДОБАВИТЬ ПРОДУКТ</button>

    <div id="raschet_musora" style="margin-top:10px; color:#8e8e93;">
      Мусор рассчитается автоматически
    </div>

    <button class="btn btn-green" onclick="sohranitZagotovku()">СОХРАНИТЬ</button>
    <button class="btn btn-secondary" onclick="showScreen('povar')">НАЗАД</button>
  </div>
</div>

<div id="shef_zagotovki" class="screen"></div>

<div id="moi_zadaniya_screen" class="screen">
  <h2>Мои задания</h2>
  <div style="display:flex; gap:8px; margin-bottom:15px;">
    <button id="tabActive" class="btn btn-green" onclick="loadMoiZadaniya('active')">Активные</button>
    <button id="tabDone" class="btn btn-grey" onclick="loadMoiZadaniya('done')">Выполненные</button>
  </div>
  <div id="spisok_zadaniy"></div>
  <button class="btn btn-grey" onclick="showScreen('povar')">НАЗАД</button>
</div>

<div id="vzyal_form" class="screen">
  <h2>Взял со склада</h2>
  <label>Товар:</label>
  <input id="vzyal_tovar" placeholder="Вырезка говяжья" />
  <label>Вес, кг:</label>
  <input id="vzyal_kg" type="number" placeholder="2.5" />
  <button class="btn btn-green" onclick="saveVzyal()">СПИСАТЬ СО СКЛАДА</button>
  <button class="btn btn-grey" onclick="showScreen('povar')">НАЗАД</button>
</div>

<div id="spisanie_form" class="screen">
  <h2>Списание/Порча</h2>
  <label>Товар:</label>
  <input id="spis_tovar" placeholder="Мякоть баранины" />
  <label>Вес, кг:</label>
  <input id="spis_kg" type="number" step="0.01" placeholder="0.5" />
  <label>Причина:</label>
  <select id="spis_prichina">
    <option value="Испорчено">Испорчено</option>
    <option value="Просрочено">Просрочено</option>
    <option value="Бой/Упал">Бой/Упал</option>
    <option value="Недостача">Недостача</option>
    <option value="Другое">Другое</option>
  </select>
  <label>Комментарий:</label>
  <input id="spis_comment" placeholder="Что случилось" />
  <button class="btn btn-green" onclick="saveSpisanie()">СПИСАТЬ</button>
  <button class="btn btn-secondary" onclick="showScreen(currentUser.role==='shef'?'shef':'povar')">НАЗАД</button>
</div>

<div id="otchet_spisanie" class="screen">
  <h2>Отходы за смену</h2>
  <div id="otchet_spisanie_table"></div>
  <button class="btn btn-secondary" onclick="showScreen('shef')">НАЗАД</button>
</div>

<div id="mesyac_otchet" class="screen">
  <h2 id="mesyac_title">Отчёт за месяц</h2>
  <input type="month" id="mesyac_picker" onchange="pokazatMesyacnyyOtchet()">
  <div id="mesyac_table"></div>
  <button class="btn btn-secondary" onclick="showScreen('shef')">НАЗАД</button>
</div>

<script>
  const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let currentPovar = null;
  let productCount = 0;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if (id === 'zagotovka_form') {
      document.getElementById('products_list').innerHTML = '';
      productCount = 0;
      addProductField();
      addProductField();
    }
  }

  function addProductField() {
    productCount++;
    const html = `
      <div class="card" id="prod_${productCount}" style="margin-top:10px; position:relative;">
        <button onclick="removeProduct(${productCount})" style="position:absolute; right:10px; top:10px; background:#ff3b30; border:none; color:#fff; border-radius:50%; width:25px; height:25px; font-size:16px;">×</button>
        <label>Продукт ${productCount}:</label>
        <input type="text" id="z_product${productCount}" placeholder="Название продукта">
        <label>Сколько кг:</label>
        <input type="number" id="z_kg${productCount}" placeholder="0.00" step="0.01" oninput="calcMusor()">
      </div>
    `;
    document.getElementById('products_list').insertAdjacentHTML('beforeend', html);
  }

  function removeProduct(id) {
    document.getElementById('prod_' + id).remove();
    calcMusor();
  }

  function calcMusor() {
    const syrye = parseFloat(document.getElementById('z_syrye_kg').value) || 0;
    let sumProducts = 0;

    document.querySelectorAll('[id^="z_kg"]').forEach(input => {
      if (!input.id.includes('syrye')) {
        sumProducts += parseFloat(input.value) || 0;
      }
    });

    const musor = +(syrye - sumProducts).toFixed(3);
    document.getElementById('raschet_musora').innerText =
      musor >= 0? `Отходы/потери: ${musor} кг` : 'Ошибка: больше чем взял';
  }

  async function login() {
    const pin = document.getElementById('pin').value;
    if (!pin) return alert('Введи пин');

    try {
      const { data, error } = await db.from('users').select().eq('pin', pin).single();
      if (error) return alert('Ошибка: ' + error.message);
      if (!data) return alert('Неверный ПИН');

      currentUser = data;
      if (data.role === 'shef') showScreen('shef');
      else loadPovarSelect();
    } catch(e) {
      alert('Ошибка: ' + e.message);
    }
  }

  async function loadPovarSelect() {
    const { data } = await db.from('users').select().eq('role', 'povar');
    const list = document.getElementById('povar_list');
    list.innerHTML = '';
    data.forEach(p => {
      list.innerHTML += `<button class="btn" onclick="selectPovar('${p.name}')">${p.name}</button>`;
    });
    showScreen('povar_select');
  }

  function selectPovar(name) {
    currentPovar = name;
    document.getElementById('povar_name').innerText = `Цех: ${name}`;
    showScreen('povar');
    updateZadanieBadge();
  }

  async function loadPovarsForZadanie() {
    const { data } = await db.from('users').select().eq('role', 'povar');
    const select = document.getElementById('komu_povar');
    select.innerHTML = '';
    data.forEach(p => {
      select.innerHTML += `<option value="${p.name}">${p.name}</option>`;
    });
    showScreen('zadanie_form');
  }

  async function saveZadanie() {
    const komu = document.getElementById('komu_povar').value;
    const text = document.getElementById('text_zadaniya').value;
    if (!text) return alert('Напиши текст задания');
    const { error } = await db.from('zadaniya').insert({
      text_zadaniya: text, komu: komu, ot_kogo: currentUser.name, status: 'новое'
    });
    if (error) return alert('Ошибка: ' + error.message);
    alert(`Задание отправлено повару ${komu}`);
    document.getElementById('text_zadaniya').value = '';
    updateZadanieBadge();
    showScreen('shef');
  }

  async function loadMoiZadaniya(tab = 'active') {
    let query = db.from('zadaniya')
    .select()
    .eq('komu', currentPovar)
    .order('created_at', { ascending: false });

    if (tab === 'active') {
      query = query.in('status', ['новое', 'в работе']);
      document.getElementById('tabActive').className = 'btn btn-green';
      document.getElementById('tabDone').className = 'btn btn-grey';
    } else {
      query = query.in('status', ['подтверждено', 'выполнено']);
      document.getElementById('tabActive').className = 'btn btn-grey';
      document.getElementById('tabDone').className = 'btn btn-green';
    }

    const { data } = await query;

    let html = '<div class="table-wrap"><table><tr><th>Задача</th><th>Статус</th><th>Дата</th><th></th></tr>';

    if (!data || data.length === 0) {
      html = `<div class="card">${tab === 'active'? 'Активных заданий нет. Отдыхай 🧱' : 'Выполненных заданий нет'}</div>`;
    } else {
      data.forEach(z => {
        const color = z.status === 'подтверждено' || z.status === 'выполнено'? '#8e8e93' : '#34c759';
        const btn = tab === 'active'
        ? `<button class="btn btn-green" style="padding:8px 12px; font-size:14px;" onclick="markZadanieDone(${z.id})">Выполнил</button>`
          : '';

        html += `<tr>
          <td>${z.text_zadaniya}</td>
          <td style="color:${color}">${z.status}</td>
          <td>${new Date(z.created_at).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}</td>
          <td>${btn}</td>
        </tr>`;
      });
      html += '</table></div>';
    }
    document.getElementById('spisok_zadaniy').innerHTML = html;
    showScreen('moi_zadaniya_screen');
  }

  async function markZadanieDone(id) {
    const { data: zadanie } = await db.from('zadaniya').select().eq('id', id).single();
    if (!zadanie) return alert('Задание не найдено');

    const produkt = parseProduktName(zadanie.text_zadaniya);
    
    const kgStr = prompt(`Сколько кг "${produkt}" получилось?`, "0");
    if (!kgStr) return;
    
    const kg = parseFloat(kgStr.replace(',', '.'));
    if (isNaN(kg) || kg <= 0) return alert('Введи корректный вес');

    await db.from('sklad_zapisi').insert({
      tovar: produkt,
      kg: kg,
      tip: 'приход',
      otvetstvenniy: currentPovar,
      comment: 'Из задания: ' + zadanie.text_zadaniya
    });

    await db.from('zagotovki').insert({
      produkt: produkt,
      iz_syrya: 'По заданию',
      kolvo_kg: kg,
      sdelal_kto: currentPovar
    });

    const { error } = await db.from('zadaniya')
    .update({ status: 'подтверждено' })
    .eq('id', id);

    if (error) return alert('Ошибка: ' + error.message);

    alert(`Подтверждено! ${kg}кг ${produkt} добавлено в заготовки`);
    loadMoiZadaniya('active');
    updateZadanieBadge();
  }

  function parseProduktName(text) {
    let name = text.toLowerCase();
    name = name.replace(/сделать|приготовить|порубить|нарезать|вытащить|из|от|для|с|в|на/g, '');
    name = name.trim();
    name = name.charAt(0).toUpperCase() + name.slice(1);
    return name || 'Заготовка';
  }

  async function updateZadanieBadge() {
    if (!currentPovar) return;

    const { count } = await db.from('zadaniya')
    .select('*', { count: 'exact', head: true })
    .eq('komu', currentPovar)
    .eq('status', 'новое');

    const badge = document.getElementById('zadanieBadge');
    if (count > 0) {
      badge.style.display = 'inline';
      badge.innerText = count;
    } else {
      badge.style.display = 'none';
    }
  }

  async function savePrihod() {
    const name = document.getElementById('tovar_name').value;
    const kg = parseFloat(document.getElementById('tovar_kg').value);
    const postavshik = document.getElementById('postavshik').value;
    if (!name ||!kg) return alert('Заполни Товар и Вес');
    const { error } = await db.from('sklad_zapisi').insert({
      tovar: name, kg: kg, tip: 'приход', postavshik: postavshik, otvetstvenniy: currentUser.name
    });
    if (error) return alert('Ошибка: ' + error.message);
    alert(`Приход сохранён: ${name} ${kg} кг`);
    document.getElementById('tovar_name').value = '';
    document.getElementById('tovar_kg').value = '';
    document.getElementById('postavshik').value = '';
    showScreen('shef');
  }

  async function saveVzyal() {
    const name = document.getElementById('vzyal_tovar').value;
    const kg = parseFloat(document.getElementById('vzyal_kg').value);
    if (!name ||!kg) return alert('Заполни Товар и Вес');
    const { error } = await db.from('sklad_zapisi').insert({
      tovar: name, kg: kg, tip: 'расход', otvetstvenniy: currentPovar
    });
    if (error) return alert('Ошибка: ' + error.message);
    alert(`${currentPovar} списал: ${name} ${kg} кг`);
    document.getElementById('vzyal_tovar').value = '';
    document.getElementById('vzyal_kg').value = '';
    showScreen('povar');
  }

  async function loadSklad() {
    const { data } = await db.from('sklad_zapisi').select();
    const ostatki = {};
    data.forEach(z => {
      if (!ostatki[z.tovar]) ostatki[z.tovar] = 0;
      if (z.tip === 'приход') ostatki[z.tovar] += z.kg;
      if (z.tip === 'расход' || z.tip === 'списание') ostatki[z.tovar] -= z.kg;
    });

    let html = '<div class="table-wrap"><table><tr><th>Товар</th><th class="kg">Остаток, кг</th></tr>';
    for (let tovar in ostatki) {
      html += `<tr><td>${tovar}</td><td class="kg">${ostatki[tovar].toFixed(2)}</td></tr>`;
    }
    html += '</table></div>';
    if (Object.keys(ostatki).length === 0) html = 'Склад пустой';

    document.getElementById('sklad_table').innerHTML = html;
    showScreen('sklad_screen');
  }

  async function sohranitZagotovku() {
    const syrye = document.getElementById('z_syrye').value;
    const syrye_kg = parseFloat(document.getElementById('z_syrye_kg').value);
    const kto = currentPovar? currentPovar : 'Неизвестно';

    if (!syrye ||!syrye_kg) return alert('Заполни что взял и сколько');

    let products = [];
    let sumProducts = 0;

    for (let i = 1; i <= productCount; i++) {
      const nameInput = document.getElementById(`z_product${i}`);
      const kgInput = document.getElementById(`z_kg${i}`);

      if (nameInput && kgInput && nameInput.value && kgInput.value) {
        const kg = parseFloat(kgInput.value);
        products.push({ name: nameInput.value, kg: kg });
        sumProducts += kg;
      }
    }

    if (products.length === 0) return alert('Добавь хотя бы 1 продукт');
    if (sumProducts > syrye_kg + 0.001) return alert('Ошибка: Сумма продуктов больше чем взял со склада');

    const musor_kg = +(syrye_kg - sumProducts).toFixed(3);

    await db.from('sklad_zapisi').insert({
      tovar: syrye, kg: syrye_kg, tip: 'расход', otvetstvenniy: kto
    });

    for (let p of products) {
      await db.from('sklad_zapisi').insert({
        tovar: p.name, kg: p.kg, tip: 'приход', otvetstvenniy: kto, comment: 'Из: ' + syrye
      });
      await db.from('zagotovki').insert({
        produkt: p.name, iz_syrya: `${syrye} ${syrye_kg}кг`, kolvo_kg: p.kg, sdelal_kto: kto
      });
    }

    if (musor_kg > 0) {
      await db.from('sklad_zapisi').insert({
        tovar: syrye + ' [ОТХОДЫ]',
        kg: musor_kg,
        tip: 'расход',
        otvetstvenniy: kto,
        comment: 'Отходы переработки'
      });
    }

    alert(`Готово!\nВзял: ${syrye} ${syrye_kg} кг\nВыход: ${sumProducts} кг\nОтходы: ${musor_kg} кг`);

    document.getElementById('z_syrye').value = '';
    document.getElementById('z_syrye_kg').value = '';
    showScreen('povar');
  }

  async function pokazatZagotovki() {
    const { data, error } = await db.from('zagotovki').select('*').order('created_at', { ascending: false });
    if (error) return alert('Ошибка загрузки: ' + error.message);

    let html = '<h2>Заготовки на базе</h2>';
    if (data.length === 0) {
      html += '<div class="card">Пока пусто</div>';
    } else {
      html += '<div class="table-wrap"><table><tr><th>Продукт</th><th>Кол-во</th><th>Из чего</th><th>Кто</th><th>Дата</th></tr>';
      data.forEach(z => {
        html += `<tr>
          <td>${z.produkt}</td>
          <td class="kg">${z.kolvo_kg} кг</td>
          <td>${z.iz_syrya}</td>
          <td>${z.sdelal_kto}</td>
          <td>${new Date(z.created_at).toLocaleString('ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'})}</td>
        </tr>`;
      });
      html += '</table></div>';
  }
  html += '<button class="btn btn-secondary" onclick="showScreen(\'shef\')">НАЗАД</button>';
    document.getElementById('shef_zagotovki').innerHTML = html;
    showScreen('shef_zagotovki');
  }

  async function startInventarizatsiya() {
    const { data } = await db.from('sklad_zapisi').select('*');
    const ostatki = {};

    data.forEach(z => {
      if (!ostatki[z.tovar]) ostatki[z.tovar] = 0;
      if (z.tip === 'приход') ostatki[z.tovar] += parseFloat(z.kg);
      if (z.tip === 'расход' || z.tip === 'списание') ostatki[z.tovar] -= parseFloat(z.kg);
    });

    let html = '<div class="table-wrap"><table><tr><th>Товар</th><th>По системе</th><th>Факт</th></tr>';

    for (let tovar in ostatki) {
      if (ostatki[tovar] > 0.001) {
        html += `<tr>
          <td>${tovar}</td>
          <td>${ostatki[tovar].toFixed(2)} кг</td>
          <td><input type="number" id="fact_${tovar}" placeholder="Факт"></td>
        </tr>`;
      }
    }

    html += '</table><button class="btn" onclick="sohranitInventarizatsiyu()">Сохранить</button></div>';
    document.getElementById('shef_zagotovki').innerHTML = html;
    showScreen('shef_zagotovki');
  }

  async function sohranitInventarizatsiyu() {
    const inputs = document.querySelectorAll('input[id^="fact_"]');

    for (let input of inputs) {
      const tovar = input.id.replace('fact_', '');
      const fact = parseFloat(input.value);

      if (!isNaN(fact)) {
        await db.from('sklad_zapisi').insert({
          tovar: tovar,
          kg: fact,
          tip: 'инвентаризация',
          comment: 'Инвентаризация'
        });
      }
    }

    alert('Сохранено!');
    showScreen('shef');
  }

  function logout() {
    currentUser = null;
    currentPovar = null;
    document.getElementById('pin').value = '';
    showScreen('login');
  }
</script>
</body>
</html>
