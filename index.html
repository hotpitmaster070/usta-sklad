<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USTA 🧱 СКЛАД</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:sans-serif; padding:20px; }
    input, button { width:100%; padding:15px; margin:10px 0; font-size:18px; border-radius:8px; border:none; }
    input { background:#1a1a1a; color:#fff; }
    button { background:#ff4d00; color:#000; font-weight:900; }
    #status { margin-top:20px; font-weight:bold; }
  </style>
</head>
<body>
  <h1>USTA 🧱 СКЛАД</h1>
  <input id="zapis" placeholder="Товар Кол-во Цех" />
  <button onclick="add()">[ДОБАВИТЬ НА СКЛАД]</button>
  <div id="status"></div>

<script>
  // ВСТАВЬ СВОИ ДАННЫЕ СЮДА
  const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_c6VHXNNPEEopejxL_W8tdA_YoGQROfD';
  
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const status = document.getElementById('status');

  async function add() {
    const zapis = document.getElementById('zapis').value;
    if (!zapis) return status.innerText = 'ЗАПОЛНИ ПОЛЕ, УСТА 🧱';
    
    status.innerText = 'ОТПРАВЛЯЮ...';
    const { error } = await db.from('sklad_zapisi').insert({ zapis: zapis });
    
    if (error) {
      status.style.color = '#ff3b30';
      status.innerText = 'ОШИБКА: ' + error.message;
    } else {
      status.style.color = '#30d158';
      status.innerText = 'УСТА 🧱 ЗАПИСАЛ 🧱';
      document.getElementById('zapis').value = '';
    }
  }
</script>
</body>
</html>
