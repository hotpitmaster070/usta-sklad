<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШТАБ УСТА</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .btn { background: #ff3b30; color: #fff; border: none; padding: 18px; margin: 8px 0; width: 100%; font-size: 18px; font-weight: bold; border-radius: 12px; }
    .btn-green { background: #34c759; }
    .btn-grey { background: #48484a; }
    input, select { width: 100%; padding: 15px; margin: 8px 0; font-size: 16px; border-radius: 8px; border: 1px solid #48484a; background: #2c2c2e; color: #fff; box-sizing: border-box; }
    h1 { text-align: center; }
    .plan-percent { font-size: 72px; font-weight: 900; text-align: center; margin: 20px 0; color: #34c759; }
    .povar-list button { background: #2c2c2e; }
  </style>
</head>
<body>

<div id="login" class="screen active">
  <h1>ШТАБ УСТА 🧱</h1>
  <input id="pin" type="password" placeholder="ПИН для входа" />
  <button class="btn" onclick="login()">ВОЙТИ</button>
</div>

<div id="shef" class="screen">
  <h1>Экран Шефа 🧱</h1>
  <button class="btn" onclick="alert('Форма Прихода')">1. [+ ПРИХОД ТОВАРА]</button>
  <button class="btn" onclick="alert('Форма Задания')">2. [СОЗДАТЬ ЗАДАНИЕ]</button>
  <button class="btn" onclick="alert('Экран Склада')">4. [МОЙ СКЛАД]</button>
  <button class="btn btn-grey" onclick="logout()">ВЫЙТИ</button>
</div>

<div id="povar_select" class="screen">
  <h1>Ты кто?</h1>
  <div id="povar_list" class="povar-list"></div>
  <button class="btn btn-grey" onclick="logout()">ВЫЙТИ</button>
</div>

<div id="povar" class="screen">
  <h1 id="povar_name"></h1>
  <button class="btn" onclick="alert('Форма: Взял со склада')">ВЗЯТЬ СО СКЛАДА</button>
  <button class="btn" onclick="alert('Список заданий')">МОИ ЗАДАНИЯ</button>
  <button class="btn" onclick="alert('Форма: Вернуть на склад')">ВЕРНУТЬ НА СКЛАД</button>
  <button class="btn btn-grey" onclick="showScreen('povar_select')">СМЕНИТЬ ПОВАРА</button>
</div>

<script>
  const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function login() {
    const pin = document.getElementById('pin').value;
    const { data } = await db.from('users').select().eq('pin', pin).single();
    if (!data) return alert('Неверный ПИН');
    
    currentUser = data;
    if (data.role === 'shef') {
      showScreen('shef');
    } else {
      loadPovarSelect();
    }
  }

  async function loadPovarSelect() {
    const { data } = await db.from('users').select().eq('role', 'povar');
    const list = document.getElementById('povar_list');
    list.innerHTML = '';
    data.forEach(p => {
      list.innerHTML += `<button class="btn" onclick="selectPovar('${p.name}')">${p.name}</button>`;
    });
    showScreen('povar_select');
  }

  function selectPovar(name) {
    document.getElementById('povar_name').innerText = `Цех: ${name}`;
    showScreen('povar');
  }

  function logout() {
    currentUser = null;
    document.getElementById('pin').value = '';
    showScreen('login');
  }
</script>

</body>
</html>
