<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация ресторана</title>
<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #1a1a1a;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.box {
  background: #2a2a2a;
  padding: 32px;
  border-radius: 12px;
  width: 100%;
  max-width: 360px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}
input {
  background: #3a3a3a;
  color: #fff;
}
button {
  background: #ff3b30;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
button:disabled {
  background: #555;
  cursor: not-allowed;
}
h2 { margin: 0 0 8px; text-align: center; }
p { color: #aaa; font-size: 14px; margin-top: 0; text-align: center; }
.msg { margin-top: 16px; font-size: 14px; text-align: center; }
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
<h2>Создать аккаунт</h2>
<p>Доступ к конструктору и системе учета</p>
<form id="signup">
  <input type="text" id="restaurant" placeholder="Название ресторана" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Пароль" minlength="6" required>
  <button type="submit" id="btn">Зарегистрироваться</button>
</form>
<div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('signup').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  msg.textContent = 'Регистрирую...';
  msg.style.color = '#aaa';

  const restaurant = document.getElementById('restaurant').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    // 1. Создаём юзера в Auth
    const { data: authData, error: authError } = await supabase.auth.signUp({
      email: email,
      password: password
    });

    if (authError) throw authError;

    // 2. Пишем в clients
    const { error: dbError } = await supabase.from('clients').insert([{
      user_id: authData.user.id,
      tenant_id: authData.user.id,
      name: restaurant,
      login: email,
      password: 'supabase_auth',
      role: 'owner',
      status: 'active',
      paid_until: new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0]
    }]);

    if (dbError) throw dbError;

    // 3. Переход в конструктор
    msg.textContent = 'Готово! Переход в конструктор...';
    msg.style.color = '#4caf50';
    setTimeout(() => {
      window.location.href = '/usta-sklad/constructor.html';

  } catch (err) {
    msg.textContent = 'Ошибка: ' + err.message;
    msg.style.color = '#ff3b30';
    btn.disabled = false;
  }
};
</script>
</body>
    </html>
