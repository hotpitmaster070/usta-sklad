<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация</title>
<style>
  body {
    background: #1a1a1a; color: #fff; font-family: sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
  }
  .box {
    background: #2a2a2a; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;
  }
  input {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #444;
    border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; box-sizing: border-box;
  }
  button {
    width: 100%; padding: 14px; background: #4caf50; color: white; border: none;
    border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #666; }
  #msg { margin-top: 12px; text-align: center; color: #aaa; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <h2>Регистрация ресторана</h2>
    <form id="signup">
      <input id="restaurant" type="text" placeholder="Название ресторана" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Пароль" minlength="6" required>
      <button id="btn" type="submit">Зарегистрироваться</button>
    </form>
    <div id="msg"></div>
  </div>

<script>
const supabase = window.supabase.createClient(
  'https://xljogkyropyocvuuodfl.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
);

document.getElementById('signup').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = 'Регистрирую...';

  const restaurant = document.getElementById('restaurant').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    // 1. Создаём пользователя в auth
    const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
    if (authError) throw authError;
    const userId = authData.user.id;

    // 2. Создаём организацию
    const { data: org, error: orgError } = await supabase
      .from('organizations')
      .insert({ name: restaurant })
      .select()
      .single();
    if (orgError) throw orgError;

    // 3. Создаём профиль в clients
    const { error: clientError } = await supabase.from('clients').insert({
      id: userId,
      org_id: org.id,
      name: restaurant
    });
    if (clientError) throw clientError;

    // 4. Делаем пользователя owner
    const { error: membError } = await supabase.from('memberships').insert({
      user_id: userId,
      org_id: org.id,
      role: 'owner'
    });
    if (membError) throw membError;

    msg.textContent = 'Готово! Перенаправляю...';
    setTimeout(() => window.location.href = 'chef.html', 800);

  } catch (err) {
    msg.textContent = '';
    alert('Ошибка: ' + err.message);
    btn.disabled = false;
  }
};
</script>
</body>
</html>
