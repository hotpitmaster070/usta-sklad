<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация</title>
<style>
  body {
    background: #1a1a1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
.box {
    background: #2a2a2a;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
  }
  h2 {
    margin: 0 0 20px 0;
    text-align: center;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #1a1a1a;
    color: #fff;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
  }
  button:disabled {
    background: #666;
  }
  #msg {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <h2>Регистрация ресторана</h2>
    <form id="signup">
      <input id="restaurant" type="text" placeholder="Название ресторана" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Пароль" minlength="6" required>
      <button id="btn" type="submit">Зарегистрироваться</button>
    </form>
    <div id="msg"></div>
  </div>

<script>
const SUPABASE_URL = 'https://xljogkyropyocvuuodfl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('signup').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  msg.textContent = 'Регистрирую...';
  msg.style.color = '#aaa';

  const restaurant = document.getElementById('restaurant').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const { data: authData, error: authError } = await supabase.auth.signUp({
      email: email,
      password: password
    });
    if (authError) throw authError;

    const { error: dbError } = await supabase.from('clients').insert([{
      user_id: authData.user.id,
      tenant_id: authData.user.id,
      name: restaurant,
      login: email,
      password: 'supabase_auth',
      role: 'owner',
      status: 'active',
      paid_until: new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0]
    }]);
    if (dbError) throw dbError;

    msg.textContent = 'Готово! Переход...';
    msg.style.color = '#4caf50';

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1000);

  } catch (err) {
    msg.textContent = 'Ошибка: ' + err.message;
    msg.style.color = '#ff3b30';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
