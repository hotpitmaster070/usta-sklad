<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация</title>
<style>
  body {
    background: #1a1a1a; color: #fff; font-family: sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
  }
  .box {
    background: #2a2a2a; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;
  }
  input {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #444;
    border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 16px; box-sizing: border-box;
  }
  button {
    width: 100%; padding: 14px; background: #4caf50; color: white; border: none;
    border-radius: 8px; font-size: 16px; font-weight: 600;
  }
  button:disabled { background: #666; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <h2>Регистрация ресторана</h2>
    <form id="signup">
      <input id="restaurant" type="text" placeholder="Название ресторана" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Пароль" minlength="6" required>
      <button id="btn" type="submit">Зарегистрироваться</button>
    </form>
    <div id="msg"></div>
  </div>

<script>
const supabase = window.supabase.createClient(
  'https://xljogkyropyocvuuodfl.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsam9na3lyb3B5b2N2dXVvZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODA5MjgsImV4cCI6MjA5Mzg1NjkyOH0.e7m1owNpYoqTpnGRKeEiMlTAIp0T0bAe28v6MX-MyVs'
);

document.getElementById('signup').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;

  const restaurant = document.getElementById('restaurant').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
  if (authError) { alert('Ошибка: ' + authError.message); btn.disabled = false; return; }

  const { error: dbError } = await supabase.from('clients').insert([{
    user_id: authData.user.id,
    name: restaurant,
    login: email,
    password: 'supabase_auth'
  }]);
  
  if (dbError) { alert('Ошибка: ' + dbError.message); btn.disabled = false; return; }

  alert('Готово!');
  window.location.href = 'index.html';
};
</script>
</body>
</html>
